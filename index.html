<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abre-me</title>
<meta name="theme-color" content="#0e3a2b">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">

<style>
  /*
    VOICE: natalício, carinhoso, com piada.
    IDEA: uma porta de Natal que dá para um calendário do Advento feito à mão.
    PICTURE: porta vermelha em arco com coroa; depois uma grelha de 24 portas.
    COLOUR and TYPE: verde-pinheiro, vermelho, creme, vinho e dourado; Archivo Black + Cormorant.
    LAYOUT: porta ao centro; calendário com título grande e grelha em mosaico.
  */
  /* Fontes: SIL Open Font License 1.1 (Archivo Black Project Authors; Cormorant Project Authors) */
  @font-face { font-family: "Archivo Black"; src: url("fonts/archivo-black.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cormorant-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cormorant-500i.woff2") format("woff2"); font-weight: 500; font-style: italic; font-display: swap; }

  :root {
    --pine: #0e3a2b; --pine-2: #0a2c20;
    --wine: #1c0509; --wine-2: #2a0a10; --wine-3: #4b0d18;
    --red: #e8403a; --red-2: #c92b27; --cream: #f7efe6; --blush: #f2dcdb;
    --gold: #e6be6a; --gold-2: #c9973f; --ink: #2a0a10;
    --heavy: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    --serif: "Cormorant", "Cormorant Garamond", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: var(--sans); background: var(--wine); color: var(--cream); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  .dots {
    background-color: var(--bg);
    background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1.4px);
    background-size: 26px 26px;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  /* ---------- Ecrã da porta ---------- */
  #entry {
    --bg: var(--pine);
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    transition: opacity .9s ease .9s;
  }
  #entry.gone { opacity: 0; pointer-events: none; }
  .kicker { font: 700 13px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
  #entry h1 { font: 400 clamp(34px, 8vw, 54px)/1.02 var(--heavy); color: var(--cream); margin: 0 auto 30px; max-width: 12ch; letter-spacing: -.02em; }
  .door-wrap { perspective: 1100px; display: inline-block; }
  .door {
    position: relative; width: min(56vw, 230px); aspect-ratio: 230 / 330; border: 0; padding: 0; cursor: pointer; background: none;
    transition: transform 1.3s cubic-bezier(.6,0,.2,1) .7s; transform-origin: 50% 55%;
  }
  .door:focus-visible { outline: 3px solid var(--gold); outline-offset: 8px; border-radius: 120px 120px 10px 10px; }
  .frame {
    position: absolute; inset: 0; border-radius: 999px 999px 10px 10px; background: var(--cream);
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  .light {
    position: absolute; inset: 9px; border-radius: 999px 999px 6px 6px; overflow: hidden;
    background: radial-gradient(70% 60% at 50% 55%, #fff6d8 0%, #ffd36e 40%, #e0a33a 75%, #b97a1e 100%);
  }
  .leaf {
    position: absolute; top: 9px; bottom: 9px; width: calc(50% - 9px); background: var(--red);
    transition: transform 1.1s cubic-bezier(.5,0,.2,1); backface-visibility: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .leaf.l { left: 9px; border-radius: 999px 0 0 6px / 999px 0 0 6px; transform-origin: left center; border-right: 1px solid rgba(0,0,0,.25); }
  .leaf.r { right: 9px; border-radius: 0 999px 6px 0 / 0 999px 6px 0; transform-origin: right center; }
  .leaf::after {   /* almofadas da porta */
    content: ""; position: absolute; left: 16%; right: 16%; top: 58%; height: 26%; border: 1.5px solid rgba(0,0,0,.12); border-radius: 4px;
  }
  .door.open .leaf.l { transform: rotateY(-108deg); }
  .door.open .leaf.r { transform: rotateY(108deg); }
  .door.zoom { transform: scale(9); }
  .wreath { position: absolute; left: 50%; top: 22%; width: 40%; transform: translateX(-50%); transition: opacity .3s; }
  .plate {
    position: absolute; left: 50%; top: 58%; transform: translateX(-50%); padding: 6px 16px; border-radius: 6px;
    background: var(--cream); color: #a2141f; font: italic 500 clamp(18px, 4.6vw, 22px) var(--serif); box-shadow: 0 2px 4px rgba(0,0,0,.25);
    transition: opacity .3s; white-space: nowrap;
  }
  .door.open .wreath, .door.open .plate { opacity: 0; }
  .tap { margin: 22px 0 0; font: 500 14px var(--sans); color: rgba(247,239,230,.65); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .door-wrap { animation: bob 3.2s ease-in-out infinite; }

  /* ---------- Calendário ---------- */
  #cal { --bg: var(--wine); position: relative; z-index: 2; min-height: 100vh; padding: max(36px, env(safe-area-inset-top)) clamp(14px, 4vw, 40px) 60px; }
  .head { text-align: center; max-width: 720px; margin: 0 auto 30px; }
  .head h2 { font: 400 clamp(56px, 15vw, 118px)/.95 var(--heavy); margin: 0 0 14px; letter-spacing: -.03em; color: var(--cream); }
  .head p { font-size: clamp(16px, 2.3vw, 19px); line-height: 1.5; margin: 0 auto; max-width: 46ch; color: rgba(247,239,230,.88); }
  .head .kicker { color: var(--gold); margin-bottom: 6px; }
  .head .sig { font: italic 500 clamp(21px, 3vw, 25px) var(--serif); color: var(--gold); margin-top: 10px; }
  .head .soon { margin-top: 14px; font-size: 14px; color: rgba(230,190,106,.8); }

  .grid {
    --cols: 6; --gap: clamp(8px, 1.4vw, 14px);
    display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: var(--cell, 110px);
    grid-auto-flow: dense; gap: var(--gap); max-width: 980px; margin: 0 auto;
  }
  @media (max-width: 640px) { .grid { --cols: 4; } }
  .tile {
    position: relative; border: 0; padding: 0; border-radius: clamp(8px, 1.6vw, 14px); cursor: pointer; text-align: left; overflow: visible;
    font: 400 clamp(26px, 6.4vw, 54px)/1 var(--heavy); letter-spacing: -.02em;
    box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, filter .25s;
    opacity: 0; transform: translateY(18px) scale(.96);
  }
  .tile.in { opacity: 1; transform: none; }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,.45); }
  .tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .tile .n { position: absolute; left: 12%; bottom: 10%; }
  .tile.w2 { grid-column: span 2; } .tile.h2 { grid-row: span 2; }
  .c-red { background: var(--red); color: #fff; }
  .c-cream { background: var(--cream); color: var(--red-2); }
  .c-blush { background: var(--blush); color: #8d1420; }
  .c-wine { background: var(--wine-3); color: var(--blush); }
  .c-gold { background: linear-gradient(135deg, #f3d98a 0%, #d9a640 45%, #f0cf7c 70%, #c48d2f 100%); color: #fff; }
  .c-pine { background: linear-gradient(160deg, #1d6b4c, #0f4532); color: var(--cream); }

  /* presente do dia 24 */
  .gift::before, .gift::after { content: ""; position: absolute; background: rgba(255,255,255,.92); }
  .gift::before { left: 38%; top: 0; bottom: 0; width: 11%; }
  .gift::after { top: 40%; left: 0; right: 0; height: 11%; }
  .gift .bow { position: absolute; left: 43.5%; top: 45.5%; width: 46%; transform: translate(-50%, -50%); z-index: 1; }
  .gift .n { z-index: 2; font-size: clamp(44px, 11vw, 96px); text-shadow: 0 2px 10px rgba(150,95,20,.35); }
  .chip {
    position: absolute; top: 8%; left: 8%; z-index: 3; padding: 5px 10px; border-radius: 999px;
    font: 700 clamp(9px, 1.6vw, 12px) var(--sans); letter-spacing: .12em; text-transform: uppercase;
    background: rgba(255,255,255,.85); color: #6b4410;
  }
  .gift .spark { position: absolute; color: #fff; font: 400 14px var(--sans); opacity: .8; animation: tw 2.4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: .95; } }

  /* nota especial do jantar */
  .note {
    position: absolute; z-index: 4; top: -16px; right: 6%; transform: rotate(4deg);
    padding: 7px 12px 7px 10px; border-radius: 4px; background: #fff8d6; color: #7a1a12;
    font: 700 clamp(10px, 1.8vw, 13px)/1.2 var(--sans); letter-spacing: .02em; text-transform: none;
    box-shadow: 0 6px 14px rgba(0,0,0,.35); white-space: nowrap;
  }
  .note::before {  /* pionés */
    content: ""; position: absolute; left: 50%; top: -6px; width: 11px; height: 11px; border-radius: 50%; transform: translateX(-50%);
    background: radial-gradient(circle at 35% 35%, #ff8a80, #c62828); box-shadow: 0 2px 3px rgba(0,0,0,.4);
  }
  .tile.dinner { animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 0 0 0 rgba(230,190,106,.0); }
                    50% { box-shadow: 0 6px 16px rgba(0,0,0,.35), 0 0 0 6px rgba(230,190,106,.35); } }

  /* estados */
  .tile.today::after {
    content: "hoje"; position: absolute; right: 8%; top: 9%; font: 700 11px var(--sans); letter-spacing: .1em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 999px; background: var(--gold); color: var(--ink);
  }
  .tile .peek { position: absolute; right: 9%; bottom: 9%; font-size: clamp(18px, 3.6vw, 28px); line-height: 1; }
  .tile.seen .n { opacity: .55; }

  .toast {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 40;
    transform: translate(-50%, 20px); opacity: 0; transition: opacity .3s, transform .3s;
    padding: 12px 18px; border-radius: 12px; background: #13202e; color: #fff; font: 600 15px var(--sans);
    box-shadow: 0 10px 30px rgba(0,0,0,.45); pointer-events: none; text-align: center; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Janela do dia ---------- */
  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 18px; background: rgba(10,2,4,.7);
           opacity: 0; pointer-events: none; transition: opacity .35s; overflow-y: auto; }
  .modal.show { opacity: 1; pointer-events: auto; }
  .card {
    position: relative; width: min(520px, 100%); border-radius: 18px; overflow: hidden; background: var(--cream); color: var(--ink);
    box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateY(26px) scale(.96); transition: transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .modal.show .card { transform: none; }
  .card header { position: relative; padding: 22px 24px 18px; color: #fff; background: var(--red); }
  .card header.dinner { background: linear-gradient(160deg, #1d6b4c, #0f4532); }
  .card header.big { background: linear-gradient(135deg, #f3d98a, #c48d2f); }
  .card .day { font: 400 clamp(40px, 10vw, 56px)/1 var(--heavy); letter-spacing: -.02em; }
  .card .type { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.2); font: 700 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; }
  .card .emoji { position: absolute; right: 66px; top: 50%; transform: translateY(-50%); font-size: clamp(46px, 12vw, 64px); }
  .card .body { padding: 22px 24px 26px; }
  .card h3 { font: 400 clamp(22px, 5vw, 28px)/1.15 var(--heavy); margin: 0 0 12px; letter-spacing: -.01em; color: #a2141f; }
  .card p { font-size: 17px; line-height: 1.55; margin: 0 0 12px; }
  .card ul, .card ol { margin: 0 0 12px; padding-left: 22px; font-size: 16.5px; line-height: 1.55; }
  .card pre { margin: 6px 0 14px; padding: 14px; border-radius: 12px; background: var(--wine-3); color: var(--blush); font: 600 15px/1.25 ui-monospace, Menlo, Consolas, monospace; overflow-x: auto; text-align: center; }
  .card .coupon { margin: 4px 0 14px; padding: 16px; border: 2px dashed #c92b27; border-radius: 12px; background: #fff; text-align: center; }
  .card .coupon b { display: block; font: 400 22px var(--heavy); color: #c92b27; margin-bottom: 4px; }
  .card .coupon small { font-size: 13px; color: #6a4a4a; }
  .card .sign { font: italic 500 21px var(--serif); color: #a2141f; text-align: right; margin: 6px 0 0; }
  .card a.go {
    display: flex; justify-content: center; align-items: center; min-height: 48px; margin-top: 6px; border-radius: 12px; text-decoration: none;
    background: var(--red); color: #fff; font: 700 16px var(--sans);
  }
  .card a.go:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .close {
    position: absolute; top: 10px; right: 10px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.18); color: #fff; font: 700 22px var(--sans); line-height: 1;
  }
  .close:focus-visible { outline: 3px solid #fff; }

  #mute {
    position: fixed; z-index: 45; bottom: max(14px, env(safe-area-inset-bottom)); right: max(14px, env(safe-area-inset-right));
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(230,190,106,.4); background: rgba(28,5,9,.6); color: var(--gold);
    display: none; place-items: center; cursor: pointer;
  }
  #mute.show { display: grid; }
  #mute svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

  @media (prefers-reduced-motion: reduce) {
    .door-wrap, .tile.dinner, .gift .spark { animation: none; }
    .door, .leaf, .tile, .card { transition-duration: .01s; }
  }
</style>
</head>
<body class="dots" style="--bg: var(--wine)">
<canvas id="snow"></canvas>

<section id="entry" class="dots">
  <div>
    <p class="kicker">Dezembro chegou</p>
    <h1>O Cristóvão espera-te lá dentro</h1>
    <div class="door-wrap">
      <button class="door" id="door" aria-label="Abrir a porta">
        <span class="frame"></span>
        <span class="light"></span>
        <span class="leaf l"></span>
        <span class="leaf r"></span>
        <svg class="wreath" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="34" fill="none" stroke="#1f6b45" stroke-width="15"/>
          <circle cx="50" cy="50" r="34" fill="none" stroke="#3fa36a" stroke-width="5" stroke-dasharray="7 9"/>
          <g fill="#d7262b"><circle cx="30" cy="27" r="4"/><circle cx="74" cy="34" r="4"/><circle cx="78" cy="62" r="4"/><circle cx="24" cy="66" r="4"/><circle cx="50" cy="16" r="4"/></g>
          <path d="M50 82 l-14 -9 l3 15 z M50 82 l14 -9 l-3 15 z" fill="#d7262b"/><circle cx="50" cy="82" r="5" fill="#b51d22"/>
        </svg>
        <span class="plate">Carolina</span>
      </button>
    </div>
    <p class="tap">toca na porta para entrar</p>
  </div>
</section>

<main id="cal" class="dots" hidden>
  <header class="head">
    <p class="kicker">Para</p>
    <h2>Carolina</h2>
    <p>Este dezembro, cada manhã tens uma surpresa. 24 dias em que te lembro o quanto te amo.</p>
    <p class="sig">Com amor, Cristóvão</p>
    <p class="soon" id="soon"></p>
  </header>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Surpresa do dia">
  <article class="card" id="card"></article>
</div>
<div class="toast" id="toast" role="status"></div>

<button id="mute" aria-label="Desligar som">
  <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
</button>

  const muteBtn = $("mute");
  let actx = null, gain = null, fallback = null, muted = false;
  const LOOP_LEN = 9.40;
  async function startMusic() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = "playback";
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      const resumed = actx.resume();                 // ainda dentro do toque
      gain = actx.createGain(); gain.gain.value = 0; gain.connect(actx.destination);
      await resumed;
      const buf = await fetch("music.mp3").then(r => r.arrayBuffer()).then(a => new Promise((ok, err) => actx.decodeAudioData(a, ok, err)));
      const src = actx.createBufferSource();
      src.buffer = buf; src.loop = true; src.loopStart = 0; src.loopEnd = Math.min(LOOP_LEN, buf.duration);
      src.connect(gain); src.start();
      gain.gain.setValueAtTime(0, actx.currentTime); gain.gain.linearRampToValueAtTime(muted ? 0 : 1, actx.currentTime + .8);
    } catch (_) {
      fallback = new Audio("music.mp3"); fallback.loop = true; fallback.muted = muted;
      fallback.play().catch(() => {});
    }
    muteBtn.classList.add("show");
  }
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    if (gain) gain.gain.setTargetAtTime(muted ? 0 : 1, actx.currentTime, .05);
    if (fallback) fallback.muted = muted;
    $("waves").style.display = muted ? "none" : "";
    muteBtn.setAttribute("aria-label", muted ? "Ligar som" : "Desligar som");
  });

  // ---------- Porta de entrada ----------
  const door = $("door"), entry = $("entry"), cal = $("cal");
  let entered = false;
  door.addEventListener("click", () => {
    if (entered) return;
    entered = true;
    startMusic();
    door.classList.add("open");
    setTimeout(() => door.classList.add("zoom"), reduce ? 0 : 500);
    cal.hidden = false;
    setTimeout(() => { entry.classList.add("gone"); revealGrid(); }, reduce ? 50 : 1300);
    setTimeout(() => entry.remove(), 2600);
  });

  // ---------- Grelha ----------
  const grid = $("grid");
  const BOW = `<svg class="bow" viewBox="0 0 120 70" aria-hidden="true"><g fill="rgba(255,255,255,.95)" stroke="rgba(200,170,120,.5)" stroke-width="2">
    <path d="M60 36 C40 4 6 8 10 30 C14 50 44 44 60 36Z"/><path d="M60 36 C80 4 114 8 110 30 C106 50 76 44 60 36Z"/>
    <path d="M56 38 L40 68 L50 66 L58 40Z"/><path d="M64 38 L80 68 L70 66 L62 40Z"/><circle cx="60" cy="36" r="8"/></g></svg>`;
  function tileHTML([day, w, h, color]) {
    const cls = ["tile", `c-${color}`, w > 1 ? "w2" : "", h > 1 ? "h2" : "", day === 24 ? "gift" : "", day === DINNER_DAY ? "dinner c-pine" : ""].join(" ");
    let inner = `<span class="n">${day}</span>`;
    if (day === 24) inner = `<span class="chip">O grande dia</span>${BOW}<span class="spark" style="left:72%;top:18%">✦</span><span class="spark" style="left:20%;top:78%;animation-delay:1.1s">✦</span><span class="n">24</span>`;
    if (day === DINNER_DAY) inner += `<span class="note">🎄 O nosso jantar de Natal</span>`;
    return `<button class="${cls}" data-day="${day}" aria-label="Dia ${day}">${inner}</button>`;
  }
  grid.innerHTML = LAYOUT.map(tileHTML).join("");
  const tiles = [...grid.querySelectorAll(".tile")];

  function sizeGrid() {
    const cols = parseInt(getComputedStyle(grid).getPropertyValue("--cols")) || 6;
    const gap = parseFloat(getComputedStyle(grid).columnGap) || 10;
    grid.style.setProperty("--cell", ((grid.clientWidth - gap * (cols - 1)) / cols) + "px");
  }
  const ro = new ResizeObserver(sizeGrid); ro.observe(grid);

  function revealGrid() {
    sizeGrid();
    tiles.forEach((t, i) => setTimeout(() => t.classList.add("in"), reduce ? 0 : 120 + i * 45));
  }

  function refreshTiles() {
    const seen = store.get("advento-vistos") || [];
    const today = todayDay();
    for (const t of tiles) {
      const d = +t.dataset.day;
      t.classList.toggle("today", d === today && !seen.includes(d));
      t.classList.toggle("seen", seen.includes(d));
      const peek = t.querySelector(".peek");
      if (seen.includes(d) && DAYS && !peek && d !== 24) t.insertAdjacentHTML("beforeend", `<span class="peek" aria-hidden="true">${DAYS[d].emoji}</span>`);
    }
    const first = opensAt(1);
    const t = now();
    $("soon").textContent = (!preview && t < first)
      ? `A primeira porta abre a 1 de dezembro (faltam ${Math.ceil((first - t) / 86400000)} dias).`
      : "";
  }

  // ---------- Avisos e janela ----------
  const toast = $("toast");
  let toastT = 0;
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove("show"), 2600);
  }
  const modal = $("modal"), card = $("card");
  let lastFocus = null;
  function openDay(day) {
    if (!DAYS) DAYS = decode();
    const d = DAYS[day];
    const hdr = day === DINNER_DAY ? "dinner" : day === 24 ? "big" : "";
    card.innerHTML = `
      <button class="close" aria-label="Fechar">×</button>
      <header class="${hdr}"><div class="day">${day} dez</div><span class="type">${d.type}</span><span class="emoji" aria-hidden="true">${d.emoji}</span></header>
      <div class="body"><h3>${d.title}</h3>${d.body}</div>`;
    card.querySelector(".close").addEventListener("click", closeDay);
    lastFocus = document.activeElement;
    modal.classList.add("show");
    card.querySelector(".close").focus({ preventScroll: true });
    const seen = store.get("advento-vistos") || [];
    if (!seen.includes(day)) { seen.push(day); store.set("advento-vistos", seen); }
    refreshTiles();
    burst(day === 24 || day === DINNER_DAY ? 90 : 40);
  }
  function closeDay() {
    modal.classList.remove("show");
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }
  modal.addEventListener("click", e => { if (e.target === modal) closeDay(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("show")) closeDay(); });

  grid.addEventListener("click", e => {
    const t = e.target.closest(".tile"); if (!t) return;
    const day = +t.dataset.day;
    if (!isOpen(day)) {
      t.animate([{ transform: "rotate(0)" }, { transform: "rotate(-3deg)" }, { transform: "rotate(3deg)" }, { transform: "rotate(0)" }], { duration: 360 });
      showToast(`Esta porta abre a ${day} de dezembro.`);
      return;
    }
    openDay(day);
  });

  // ---------- Brilhos ao abrir um dia ----------
  function burst(n) {
    if (reduce) return;
    const cols = ["#e6be6a", "#ffffff", "#e8403a", "#3fa36a", "#f2dcdb"];
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.textContent = Math.random() < .5 ? "✦" : "❄";
      s.style.cssText = `position:fixed;left:50%;top:45%;z-index:35;pointer-events:none;color:${cols[i % cols.length]};font-size:${10 + Math.random() * 16}px`;
      document.body.appendChild(s);
      const a = Math.random() * 6.283, r = 120 + Math.random() * Math.min(innerWidth, innerHeight) * .45;
      s.animate([{ transform: "translate(-50%,-50%) scale(.3)", opacity: 1 },
                 { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r + 60}px)) scale(1) rotate(${Math.random() * 360}deg)`, opacity: 0 }],
                { duration: 1100 + Math.random() * 700, easing: "cubic-bezier(.2,.8,.2,1)" }).onfinish = () => s.remove();
    }
  }

  // ---------- Arranque ----------
  addEventListener("resize", snowResize); snowResize(); if (!reduce) requestAnimationFrame(drawSnow);
  (async () => {
    await Promise.all([syncClock(), checkPreview()]);
    if ((store.get("advento-vistos") || []).length) DAYS = decode();
    refreshTiles();
    setInterval(refreshTiles, 30000);
    setInterval(syncClock, 5 * 60 * 1000);
  })();
}
</script>
</body>
</html>
